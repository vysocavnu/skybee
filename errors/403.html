<style>*{box-sizing:border-box}
:root{--bg:#f6f1e6;--bg2:#ece2cf;--text:#3f372b;--muted:#857761;--btn:#f5b301;--btnink:#1a1400;--line:#d9c9ab;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0f1218;--bg2:#171b23;--text:#e6e9ef;--muted:#8a93a6;--line:#262c38;color-scheme:dark}}
:root[data-theme=dark],:root[data-theme=dim]{--bg:#0f1218;--bg2:#171b23;--text:#e6e9ef;--muted:#8a93a6;--line:#262c38;color-scheme:dark}
:root[data-theme=dim]{--bg:#161e27;--bg2:#1e2833}
body{margin:0;min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px 16px;
  background:radial-gradient(ellipse at 50% 0%,var(--bg2),var(--bg) 70%);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;text-align:center}
main{max-width:520px}
.bee{width:150px;height:150px;animation:float 3.2s ease-in-out infinite;filter:drop-shadow(0 10px 14px rgba(150,110,40,.18))}
.w{transform-box:view-box;transform-origin:62px 50px;animation:flap .09s ease-in-out infinite alternate}
@keyframes float{0%,100%{transform:translate(0,0) rotate(-3deg)}50%{transform:translate(6px,-12px) rotate(3deg)}}
@keyframes flap{from{transform:rotate(3deg)}to{transform:rotate(-14deg) scaleY(.85)}}
@media (prefers-reduced-motion:reduce){.bee,.w{animation:none}}
.code{font-size:clamp(64px,18vw,112px);font-weight:800;line-height:1;margin:8px 0 4px;background:linear-gradient(135deg,#e8c97f,#b98f45);-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:.02em}
h1{font-size:clamp(22px,5vw,30px);margin:8px 0}
p{color:var(--muted);margin:8px 0}
.tech{font:13px/1.4 ui-monospace,Consolas,monospace;color:var(--muted);border:1px dashed var(--line);border-radius:10px;padding:8px 12px;display:inline-block;margin-top:10px;word-break:break-all}
.btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:22px}
a.btn,button.btn{font:inherit;font-weight:700;border-radius:999px;padding:10px 22px;text-decoration:none;cursor:pointer;border:0;background:var(--btn);color:var(--btnink)}
.ghost{background:none!important;border:1px solid var(--line)!important;color:var(--text)!important}
footer{margin-top:28px;font-size:13px;color:var(--muted)}</style>
