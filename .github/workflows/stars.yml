# Раз на добу оновлює data/stars.json з starsaboutwar.in.ua (позиції виконавців щодо війни для «✨ Оформлення»).
# Сайт не має API і не дозволяє читати себе з браузера, тож дані збирає цей workflow, а Skybee читає готовий файл
# із GitHub Pages. Коміт робиться лише тоді, коли щось змінилося (нові виконавці, зміна позиції).
name: Stars about war

on:
  schedule:
    - cron: "17 2 * * *" # щодня о 04:17 за Києвом (зимовий час)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stars
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Зібрати дані
        run: node scripts/stars-sync.mjs
      - name: Зберегти, якщо змінилися
        run: |
          if git diff --quiet -- data/stars.json && git ls-files --error-unmatch data/stars.json >/dev/null 2>&1; then
            echo "Без змін"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/stars.json
          git commit -m "Дані starsaboutwar.in.ua: щоденне оновлення"
          git push
