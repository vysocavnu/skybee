# Збирає Skybee для телефонів (Capacitor, mobile/): Android APK та iOS IPA.
# - будь-які зміни застосунку (веб чи mobile/) або ручний запуск → файли в артефактах запуску
#   і в тестовому (pre-release) релізі «mobile-test» — його зручно відкрити просто з телефона
# - тег vX.Y.Z або ручний запуск із полем «version» → файли ще й у звичайному релізі разом із десктопом
# APK підписаний ключем із GitHub Secrets (той самий у кожній збірці, тож нова ставиться поверх старої).
# IPA — без підпису (для нього потрібен акаунт Apple Developer): поставити на iPhone можна через Sideloadly чи AltStore,
# вони підпишуть його вашим Apple ID.
name: Mobile (Android, iOS)

on:
  push:
    tags: ["v*"]
    branches: ["main"] # лише main: інакше кожна зміна збиралася двічі (гілка + злиття) і гілка перезаписувала тестові релізи
    paths: ["mobile/**", "scripts/dist.mjs", ".github/workflows/mobile.yml", "index.html", "css/**", "js/**", "icons/**"]
  workflow_dispatch:
    inputs:
      version:
        description: "Викласти ще й у реліз із цим тегом (наприклад v0.3.0), разом із десктопом; порожньо — лише mobile-test"
        required: false
        default: ""

permissions:
  contents: write

env:
  # тег релізу: з пушу тегу або з ручного запуску
  RELEASE_TAG: ${{ inputs.version || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || '' }}

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - name: Вебчастина й проєкт Android
        run: |
          npm run web
          npx cap add android
          npx capacitor-assets generate --android --iconBackgroundColor '#ffffff' --iconBackgroundColorDark '#ffffff' --splashBackgroundColor '#ffffff' --splashBackgroundColorDark '#0f1218'
          npx cap sync android
      - name: Посилання skybee:// (повернення з реєстрації в браузері)
        run: |
          python3 - <<'PY'
          p = "android/app/src/main/AndroidManifest.xml"
          s = open(p).read()
          f = """            <intent-filter>
                          <action android:name="android.intent.action.VIEW" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.BROWSABLE" />
                          <data android:scheme="skybee" />
                      </intent-filter>
          """
          assert "</activity>" in s
          s = s.replace("        </activity>", f + "        </activity>", 1)
          # без резервних копій: інакше збережені входи (токени) потрапляють у копію Google Drive та adb backup
          assert 'android:allowBackup="true"' in s
          s = s.replace('android:allowBackup="true"', 'android:allowBackup="false" android:fullBackupContent="false"', 1)
          open(p, "w").write(s)
          PY
          grep -n "skybee\|allowBackup" android/app/src/main/AndroidManifest.xml
      - name: Версія
        run: |
          V=$(node -p "require('./package.json').version")
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"$V\"/" android/app/build.gradle
          grep -n "versionCode\|versionName" android/app/build.gradle
          echo "VER=$V" >> "$GITHUB_ENV"
      - name: Ключ підпису
        # Справжній ключ — лише в GitHub Secrets (ANDROID_KEYSTORE_B64 = keystore у base64, ANDROID_KEYSTORE_PASS,
        # ANDROID_KEY_ALIAS, ANDROID_KEY_PASS), у репозиторії його немає. Старий тестовий ключ був публічним — прибраний.
        # Ключ прописано в самій збірці: копія в ~/.android/ не діяла (Gradle робив свій випадковий ключ).
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KS_KEY_PASS: ${{ secrets.ANDROID_KEY_PASS }}
        run: |
          if [ -n "$KS" ]; then
            # base64 з Linux/macOS чи з Windows (certutil додає рядки -----BEGIN/END----- і переноси)
            printf '%s' "$KS" | grep -v -- '-----' | tr -d ' \r\n\t' | base64 -d > "$RUNNER_TEMP/skybee.keystore"
            keytool -list -keystore "$RUNNER_TEMP/skybee.keystore" -storepass "$KS_PASS" -alias "$KS_ALIAS" > /dev/null \
              || { echo "::error::Ключ із секретів не відкривається: перевір ANDROID_KEYSTORE_B64 (base64), ANDROID_KEYSTORE_PASS, пароль і псевдонім (ANDROID_KEY_ALIAS)"; exit 1; }
            {
              echo "SKYBEE_KS=$RUNNER_TEMP/skybee.keystore"
              echo "SKYBEE_KS_PASS=$KS_PASS"
              echo "SKYBEE_KS_ALIAS=$KS_ALIAS"
              echo "SKYBEE_KS_KEY_PASS=${KS_KEY_PASS:-$KS_PASS}"
            } >> "$GITHUB_ENV"
          else
            echo "::error::Немає секрету ANDROID_KEYSTORE_B64 — APK нема чим підписати (Settings → Secrets and variables → Actions)"; exit 1
          fi
          cat >> android/app/build.gradle <<'GRADLE'

          android {
              signingConfigs {
                  skybee {
                      storeFile file(System.getenv("SKYBEE_KS"))
                      storePassword System.getenv("SKYBEE_KS_PASS")
                      keyAlias System.getenv("SKYBEE_KS_ALIAS")
                      keyPassword System.getenv("SKYBEE_KS_KEY_PASS")
                  }
              }
              buildTypes {
                  debug { signingConfig signingConfigs.skybee }
                  // релізна збірка (не debuggable: без run-as і без налагодження WebView з ПК, де видно токени)
                  release { signingConfig signingConfigs.skybee }
              }
              lint { checkReleaseBuilds false }
          }
          GRADLE
      - name: Збірка APK
        run: |
          cd android && ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk ../Skybee.apk
          ls -la ../Skybee.apk
      - name: Перевірка підпису (той самий ключ у кожній збірці)
        run: |
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          "$APKSIGNER" verify --print-certs Skybee.apk | tee certs.txt
          # відбиток ключа — змінна репозиторію ANDROID_CERT_SHA256 (не секрет; береться з рядка «SHA-256 digest» вище)
          # у будь-якому вигляді: 4A:1E:… з keytool чи 4a1e… з apksigner
          WANT=$(printf '%s' "${{ vars.ANDROID_CERT_SHA256 }}" | tr -d ': ' | tr A-F a-f)
          if [ -n "$WANT" ]; then
            grep -qi "SHA-256 digest: $WANT" certs.txt \
              || { echo "::error::APK підписаний не тим ключем — його не вдасться поставити поверх попередньої версії"; exit 1; }
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Skybee-Android
          path: mobile/Skybee.apk

  ios:
    runs-on: macos-15
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - name: Вебчастина й проєкт iOS
        run: |
          npm run web
          npx cap add ios
          npx capacitor-assets generate --ios --iconBackgroundColor '#ffffff' --splashBackgroundColor '#ffffff' --splashBackgroundColorDark '#0f1218'
          npx cap sync ios
      - name: Дозволи (фото, камера, мікрофон для відео)
        run: |
          P=ios/App/App/Info.plist
          plutil -replace NSPhotoLibraryUsageDescription -string "Щоб додавати фото й відео до постів" $P
          plutil -replace NSCameraUsageDescription -string "Щоб зняти фото чи відео для поста" $P
          plutil -replace NSMicrophoneUsageDescription -string "Щоб записати відео зі звуком" $P
          plutil -replace NSPhotoLibraryAddUsageDescription -string "Щоб зберігати фото з постів" $P
          plutil -replace CFBundleDisplayName -string "Skybee" $P
          plutil -replace CFBundleURLTypes -json '[{"CFBundleURLName":"io.github.vysocavnu.skybee","CFBundleURLSchemes":["skybee"]}]' $P
          plutil -p $P | grep -A3 CFBundleURLTypes
      - name: Збірка IPA (без підпису)
        run: |
          V=$(node -p "require('./package.json').version")
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' -derivedDataPath build \
            MARKETING_VERSION=$V CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" DEVELOPMENT_TEAM="" build | tail -30
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qry Skybee-unsigned.ipa Payload
          ls -la Skybee-unsigned.ipa
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Skybee-iOS
          path: mobile/Skybee-unsigned.ipa

  # обидва файли — в один тестовий реліз (і в реліз тегу), коли обидві збірки готові
  publish:
    needs: [android, ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: out
          merge-multiple: true
      - run: ls -la out
      - name: Тестовий реліз
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: mobile-test
          target_commitish: ${{ github.sha }}
          name: "Skybee для телефонів (тестова збірка №${{ github.run_number }})" # номер збірки читає «Бета-тестування» в застосунку
          prerelease: true
          make_latest: false
          body: |
            Тестові збірки для Android та iOS — оновлюються з кожною зміною застосунку.
            Android: завантажте Skybee.apk і відкрийте (дозвольте встановлення з цього джерела).
            iPhone: Skybee-unsigned.ipa встановлюється через Sideloadly чи AltStore (вони підпишуть його вашим Apple ID).
            Щоб застосунок сам повідомляв про нові збірки: Налаштування → Про Skybee → «Бета-тестування».
          files: |
            out/Skybee.apk
            out/Skybee-unsigned.ipa
      - name: Реліз
        if: env.RELEASE_TAG != ''
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          files: |
            out/Skybee.apk
            out/Skybee-unsigned.ipa
