# Збирає Skybee для Windows (Electron): інсталятор (NSIS).
# - тег vX.Y.Z  → реліз на GitHub з інсталятором і latest.yml (з нього встановлений Skybee оновлюється сам)
# - ручний запуск або зміни в оболонці → інсталятор в артефактах запуску
name: Desktop (Windows)

on:
  push:
    tags: ["v*"]
    branches: ["**"]
    paths: ["desktop/**", "scripts/dist.mjs", ".github/workflows/desktop.yml", "index.html", "css/**", "js/**", "icons/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - name: Збірка
        run: npm run dist
      - name: Пробний запуск
        shell: pwsh
        run: |
          $p = Start-Process dist/win-unpacked/Skybee.exe -PassThru
          Start-Sleep 20
          if ($p.HasExited) {
            "Skybee закрився сам, код $($p.ExitCode)"
            Get-WinEvent -FilterHashtable @{LogName='Application'; Level=2; StartTime=(Get-Date).AddMinutes(-2)} -ErrorAction SilentlyContinue | Format-List TimeCreated, ProviderName, Message
            exit 1
          }
          "Skybee працює"
          Get-Process Skybee -ErrorAction SilentlyContinue | Stop-Process -Force
      - uses: actions/upload-artifact@v4
        with:
          name: Skybee-Windows
          path: |
            desktop/dist/*.exe
            desktop/dist/latest.yml
      # latest.yml і .blockmap — для самооновлення: застосунок читає latest.yml з найновішого релізу
      - name: Перевірка файлів оновлення
        shell: pwsh
        run: |
          if (-not (Test-Path dist/latest.yml)) { "Немає latest.yml — самооновлення не працюватиме"; exit 1 }
          Get-Content dist/latest.yml
      - name: Реліз
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop/dist/*.exe
            desktop/dist/*.exe.blockmap
            desktop/dist/latest.yml
          generate_release_notes: true
