# Збирає Skybee: Windows (інсталятор NSIS), Linux (AppImage, tar.gz) і Flatpak.
# - тег vX.Y.Z  → реліз на GitHub з інсталятором і latest.yml (з нього встановлений Skybee оновлюється сам)
# - ручний запуск або зміни застосунку → інсталятор в артефактах запуску (ZIP) і готові файли без архіву
#   в тестовому (pre-release) релізі «desktop-test»: Skybee-Setup.exe, Skybee.AppImage, Skybee-linux-x64.tar.gz, Skybee.flatpak
name: Desktop (Windows)
# (назву лишено, щоб не губилася історія запусків; тепер тут і Linux, і Flatpak)

on:
  push:
    tags: ["v*"]
    branches: ["main"] # лише main: інакше кожна зміна збиралася двічі (гілка + злиття) і гілка перезаписувала тестові релізи
    paths: ["desktop/**", "flatpak/**", "scripts/dist.mjs", ".github/workflows/desktop.yml", "index.html", "css/**", "js/**", "icons/**"]
  workflow_dispatch:
    inputs:
      version:
        description: "Випустити реліз із цим тегом (наприклад v0.2.0); порожньо — лише артефакти"
        required: false
        default: ""

permissions:
  contents: write

env:
  # тег релізу: з пушу тегу або з ручного запуску
  RELEASE_TAG: ${{ inputs.version || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || '' }}

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - name: Номер бета-версії
        # тестові збірки — бета-канал застосунку: наступний патч + номер запуску (0.3.0 → 0.3.1-beta.57), тож бета завжди
        # новіша за останній реліз, а наступний реліз (0.3.1) — новіший за бету
        if: env.RELEASE_TAG == ''
        shell: bash
        run: |
          node -e "const fs=require('fs'),p=JSON.parse(fs.readFileSync('package.json','utf8')),[a,b,c]=p.version.split('-')[0].split('.').map(Number);p.version=a+'.'+b+'.'+(c+1)+'-beta.'+process.env.GITHUB_RUN_NUMBER;fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n');console.log(p.version)"
      - name: Збірка
        run: npm run dist
      - name: Пробний запуск
        shell: pwsh
        run: |
          $p = Start-Process dist/win-unpacked/Skybee.exe -PassThru
          Start-Sleep 20
          if ($p.HasExited) {
            "Skybee закрився сам, код $($p.ExitCode)"
            Get-WinEvent -FilterHashtable @{LogName='Application'; Level=2; StartTime=(Get-Date).AddMinutes(-2)} -ErrorAction SilentlyContinue | Format-List TimeCreated, ProviderName, Message
            exit 1
          }
          "Skybee працює"
          Get-Process Skybee -ErrorAction SilentlyContinue | Stop-Process -Force
      - uses: actions/upload-artifact@v4
        with:
          name: Skybee-Windows
          path: |
            desktop/dist/*.exe
            desktop/dist/latest.yml
      # latest.yml і .blockmap — для самооновлення: застосунок читає latest.yml з найновішого релізу
      - name: Перевірка файлів оновлення
        shell: pwsh
        run: |
          if (-not (Test-Path dist/latest.yml)) { "Немає latest.yml — самооновлення не працюватиме"; exit 1 }
          Get-Content dist/latest.yml
      - name: Реліз
        if: env.RELEASE_TAG != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          files: |
            desktop/dist/*.exe
            desktop/dist/*.exe.blockmap
            desktop/dist/latest.yml
          generate_release_notes: true
      # Тестовий реліз = бета-канал: ті самі файли без ZIP, зі сталими назвами, і latest.yml під ці назви — його читають
      # застосунки з увімкненим «Бета-тестуванням». Звичайні беруть лише справжні релізи (desktop-test — pre-release)
      - name: Файли для тестового релізу
        if: env.RELEASE_TAG == ''
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force test | Out-Null
          $exe = Get-ChildItem dist/*.exe | Select-Object -First 1
          Copy-Item $exe.FullName test/Skybee-Setup.exe
          Copy-Item "$($exe.FullName).blockmap" test/Skybee-Setup.exe.blockmap
          (Get-Content dist/latest.yml -Raw).Replace($exe.Name, "Skybee-Setup.exe") | Set-Content test/latest.yml -NoNewline
          Get-Content test/latest.yml
          if (-not (Select-String -Path test/latest.yml -SimpleMatch "Skybee-Setup.exe" -Quiet)) { "latest.yml не вказує на Skybee-Setup.exe"; exit 1 }
          Get-ChildItem test
      - name: Тестовий реліз
        if: env.RELEASE_TAG == ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-test
          target_commitish: ${{ github.sha }}
          name: "Skybee для комп'ютера (тестова збірка)"
          prerelease: true
          make_latest: false
          body: |
            Тестові (бета) збірки — оновлюються з кожною зміною застосунку, файли без архівів.
            Windows: Skybee-Setup.exe. Linux: Skybee.AppImage (зробіть виконуваним), Skybee-linux-x64.tar.gz або Skybee.flatpak (flatpak install --user Skybee.flatpak).
            Щоб отримувати їх автоматично: Налаштування → Про Skybee → «Бета-тестування».
          files: |
            desktop/test/Skybee-Setup.exe
            desktop/test/Skybee-Setup.exe.blockmap
            desktop/test/latest.yml

  linux:
    needs: windows # реліз створює Windows-збірка; решта лише додає до нього файли
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - name: Номер бета-версії
        # тестові збірки — бета-канал застосунку: наступний патч + номер запуску (0.3.0 → 0.3.1-beta.57), тож бета завжди
        # новіша за останній реліз, а наступний реліз (0.3.1) — новіший за бету
        if: env.RELEASE_TAG == ''
        shell: bash
        run: |
          node -e "const fs=require('fs'),p=JSON.parse(fs.readFileSync('package.json','utf8')),[a,b,c]=p.version.split('-')[0].split('.').map(Number);p.version=a+'.'+b+'.'+(c+1)+'-beta.'+process.env.GITHUB_RUN_NUMBER;fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n');console.log(p.version)"
      - name: Збірка
        run: npm run dist:linux
      - name: Перевірка
        run: |
          ls -la dist
          test -f dist/latest-linux.yml || { echo "Немає latest-linux.yml — AppImage не оновлюватиметься сам"; exit 1; }
          tar -tzf dist/*.tar.gz | grep -q '/skybee$' || { echo "У tar.gz немає виконуваного skybee"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: Skybee-Linux
          path: |
            desktop/dist/*.tar.gz
            desktop/dist/*.AppImage
            desktop/dist/latest-linux.yml
      - name: Реліз
        if: env.RELEASE_TAG != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          files: |
            desktop/dist/*.tar.gz
            desktop/dist/*.AppImage
            desktop/dist/latest-linux.yml
      - name: Файли для тестового релізу
        if: env.RELEASE_TAG == ''
        run: |
          mkdir -p test
          img=$(basename dist/*.AppImage)
          cp "dist/$img" test/Skybee.AppImage
          cp dist/*.tar.gz test/Skybee-linux-x64.tar.gz
          # бета-канал для AppImage: latest-linux.yml під сталу назву файлу
          sed "s/${img//./\\.}/Skybee.AppImage/g" dist/latest-linux.yml > test/latest-linux.yml
          cat test/latest-linux.yml
          grep -q "Skybee.AppImage" test/latest-linux.yml || { echo "latest-linux.yml не вказує на Skybee.AppImage"; exit 1; }
          ls -la test
      - name: Тестовий реліз
        if: env.RELEASE_TAG == ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-test
          target_commitish: ${{ github.sha }} # без нього оновлення релізу падає: «Resource not accessible by integration»
          prerelease: true
          make_latest: false
          files: |
            desktop/test/Skybee.AppImage
            desktop/test/Skybee-linux-x64.tar.gz
            desktop/test/latest-linux.yml

  # Flatpak з тієї самої Linux-збірки: пакет Skybee.flatpak для встановлення напряму
  # і маніфест для Flathub (з url і sha256 архіву в релізі)
  flatpak:
    needs: linux
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-24.08
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Skybee-Linux
          path: flatpak/dl
      - name: Підготовка
        run: |
          cp flatpak/dl/*.tar.gz flatpak/skybee-linux-x64.tar.gz
      - uses: flathub-infra/flatpak-github-actions/flatpak-builder@933e9e8ca36e85046ebca8e211f0785c6becac40
        with:
          bundle: Skybee.flatpak
          manifest-path: flatpak/io.github.vysocavnu.skybee.yml
          cache-key: flatpak-builder-${{ github.sha }}
          upload-artifact: true
      - name: Маніфест для Flathub
        shell: bash
        run: |
          name=$(basename flatpak/dl/*.tar.gz)
          sum=$(sha256sum flatpak/skybee-linux-x64.tar.gz | cut -d' ' -f1)
          url="https://github.com/${{ github.repository }}/releases/download/${RELEASE_TAG:-${GITHUB_REF_NAME}}/${name}"
          sed "s|        path: skybee-linux-x64.tar.gz|        url: ${url}\n        sha256: ${sum}|" flatpak/io.github.vysocavnu.skybee.yml > io.github.vysocavnu.skybee.flathub.yml
          cat io.github.vysocavnu.skybee.flathub.yml
      - uses: actions/upload-artifact@v4
        with:
          name: Flathub-manifest
          path: io.github.vysocavnu.skybee.flathub.yml
      - name: Реліз
        if: env.RELEASE_TAG != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          files: |
            Skybee.flatpak
            io.github.vysocavnu.skybee.flathub.yml
            flatpak/io.github.vysocavnu.skybee.desktop
            flatpak/io.github.vysocavnu.skybee.metainfo.xml
            flatpak/icon-512.png
      - name: Тестовий реліз
        if: env.RELEASE_TAG == ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-test
          target_commitish: ${{ github.sha }} # без нього оновлення релізу падає: «Resource not accessible by integration»
          prerelease: true
          make_latest: false
          files: Skybee.flatpak
