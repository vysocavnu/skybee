# Збирає Skybee для Windows: інсталятор (NSIS) і переносний EXE.
# - тег vX.Y.Z  → реліз на GitHub з файлами
# - ручний запуск або зміни в оболонці → файли в артефактах запуску
name: Desktop (Windows)

on:
  push:
    tags: ["v*"]
    branches: ["**"]
    paths: ["src-tauri/**", "scripts/dist.mjs", ".github/workflows/desktop.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Tauri CLI
        run: npm install -g @tauri-apps/cli@2
      - name: Збірка
        run: tauri build
      - name: Зібрати файли
        shell: bash
        run: |
          mkdir out
          cp src-tauri/target/release/bundle/nsis/*.exe out/
          cp src-tauri/target/release/skybee.exe out/Skybee-portable.exe
          ls -l out
      - name: Пробний запуск
        shell: pwsh
        env:
          RUST_BACKTRACE: "1"
        run: |
          $p = Start-Process out/Skybee-portable.exe -PassThru -RedirectStandardError err.txt -RedirectStandardOutput stdout.txt
          Start-Sleep 20
          if ($p.HasExited) {
            "Skybee закрився сам, код $($p.ExitCode)"
            Get-Content err.txt, stdout.txt
            Get-WinEvent -FilterHashtable @{LogName='Application'; Level=2; StartTime=(Get-Date).AddMinutes(-2)} -ErrorAction SilentlyContinue | Format-List TimeCreated, ProviderName, Message
            exit 1
          }
          "Skybee працює"
          Stop-Process -Id $p.Id -Force
      - uses: actions/upload-artifact@v4
        with:
          name: Skybee-Windows
          path: out/*
      - name: Реліз
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
